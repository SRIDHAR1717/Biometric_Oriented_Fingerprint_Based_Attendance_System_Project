<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
            max-width: 650px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        nav {
            text-align: center;
            margin-bottom: 25px;
        }

        nav a {
            margin: 0 12px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            color: #333;
        }

        input[type="file"] {
            margin-top: 6px;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #28a745;
            border: none;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            width: 100%;
        }

        button:hover {
            background-color: #218838;
        }

        .message {
            margin-top: 20px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .success {
            color: #155724;
            background: #d4edda;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        img {
            margin-top: 20px;
            display: block;
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            font-weight: bold;
            color: #007bff;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>📸 Mark Attendance</h1>

    <nav>
        <a href="/">🏠 Home</a>
        <a href="/register">📝 Register</a>
        <a href="/attendance">📋 View Attendance</a>
    </nav>

    <form action="/capture" method="POST" enctype="multipart/form-data">
        <label for="fingerprint">📁 Upload Fingerprint Image:</label>
        <input type="file" name="fingerprint" id="fingerprint" accept="image/*" required>

        <button type="submit">✅ Submit</button>
    </form>

    {% if message %}
        <div class="message {{ 'error' if 'not recognized' in message else 'success' }}">{{ message }}</div>
    {% endif %}

    {% if captured_image %}
        <img src="{{ captured_image }}" alt="Captured Fingerprint">
    {% endif %}

    <a href="/" class="back-link">⬅️ Back to Home</a>

</body>
</html>
